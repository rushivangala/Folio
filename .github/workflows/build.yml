name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # versionCode = commit count

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already has the Android SDK (ANDROID_HOME); Gradle fetches any missing platform itself.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p release-signing
          echo "$KEYSTORE_BASE64" | base64 -d > release-signing/release.jks
          echo "SIGNING_KEYSTORE_FILE=$PWD/release-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      # Surface the reason for a failed build as an annotation, readable without the full log.
      - name: Report build errors
        if: failure()
        run: |
          touch build.log
          { grep -E -A12 "What went wrong|error:|e: |ERROR:|FAILURE|AAPT|Exception" build.log | head -c 60000; echo; echo "--- last lines ---"; tail -n 40 build.log; } > errors.txt || true
          msg=$(sed -e 's/%/%25/g' errors.txt | sed -e 's/$/%0A/' | tr -d '[:cntrl:]')
          echo "::error title=Build failed::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: Folio-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # A release is published for a version tag, or for a push to main whose message contains [release]
      # (the tag v<appVersionName> is then created on GitHub).
      - name: Read version
        id: ver
        run: echo "name=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          name: Folio ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          body_path: CHANGELOG.md
